<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat dos Amigos</title>
<style>
:root{--bg:#fff;--side:#f2f3f5;--rail:#e3e5e8;--text:#2e3338;--muted:#5c6370;--hover:#d9dce0;--input:#ebedef;--accent:#5865f2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#313338;--side:#2b2d31;--rail:#1e1f22;--text:#dbdee1;--muted:#949ba4;--hover:#3b3d44;--input:#383a40;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#313338;--side:#2b2d31;--rail:#1e1f22;--text:#dbdee1;--muted:#949ba4;--hover:#3b3d44;--input:#383a40;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
.app{display:flex;height:100%}
.rail{width:56px;background:var(--rail);display:flex;flex-direction:column;align-items:center;padding-top:10px}
.logo{width:42px;height:42px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:20px}
.side{width:220px;background:var(--side);display:flex;flex-direction:column}
.side h3{margin:0;padding:14px 14px;font-size:15px;border-bottom:1px solid var(--rail)}
.side .lbl{padding:14px 14px 4px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
.ch{margin:1px 8px;padding:6px 8px;border-radius:5px;color:var(--muted);cursor:pointer;border:0;background:none;text-align:left;font-size:15px}
.ch:hover{background:var(--hover);color:var(--text)}
.ch.on{background:var(--hover);color:var(--text);font-weight:600}
.me{margin-top:auto;padding:10px 12px;background:var(--rail);display:flex;gap:8px;align-items:center;font-weight:600}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{padding:12px 16px;border-bottom:1px solid var(--rail);font-weight:700}
.top span{color:var(--muted);font-weight:400;margin-right:6px}
.body{flex:1;display:flex;min-height:0}
.col{flex:1;display:flex;flex-direction:column;min-width:0}
#msgs{flex:1;overflow-y:auto;padding:10px 0}
.row{display:flex;gap:14px;padding:2px 16px;position:relative}
.row:hover{background:rgba(127,127,127,.08)}
.row.first{margin-top:14px}
.av{width:40px;height:40px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.gap{width:40px;flex:none}
.hd{display:flex;gap:8px;align-items:baseline}
.nm{font-weight:600}
.ts{font-size:12px;color:var(--muted)}
.tx{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.4}
.empty{color:var(--muted);text-align:center;margin:auto;padding:40px 16px}
.inbar{padding:0 16px 18px}
.inbar input{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:8px;border:0;background:var(--input);color:var(--text);font-size:16px}
.mem{width:200px;background:var(--side);padding:14px 10px;overflow-y:auto}
.mem .lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.mi{display:flex;gap:8px;align-items:center;padding:4px;color:var(--muted)}
.mi .av{width:30px;height:30px;font-size:13px}
#login{margin:auto;padding:24px;text-align:center;max-width:320px}
#login input{width:100%;box-sizing:border-box;margin:12px 0;padding:12px;border-radius:8px;border:0;background:var(--input);color:var(--text);font-size:16px}
#login button{padding:11px 28px;border:0;border-radius:6px;background:var(--accent);color:#fff;font-size:16px;cursor:pointer}
.hide{display:none!important}
@media (max-width:760px){
 .rail,.mem{display:none}
 .app{flex-direction:column}
 .side{width:auto;flex-direction:row;overflow-x:auto;align-items:center}
 .side h3,.side .lbl,.me{display:none}
 .ch{white-space:nowrap;margin:6px 3px}
}
</style>
</head>
<body>
<div class="app">
  <div class="rail"><div class="logo">💬</div></div>
  <div class="side">
    <h3>Os Amigos</h3>
    <div class="lbl">Canais de texto</div>
    <div id="chs"></div>
    <div class="me hide" id="me"></div>
  </div>
  <div class="main">
    <div class="top" id="top"><span>#</span>geral</div>
    <div id="login">
      <h2>Bem-vindo!</h2>
      <p>Escolhe um nome para os teus amigos te reconhecerem.</p>
      <input id="nameIn" maxlength="20" placeholder="O teu nome" autocomplete="nickname">
      <button id="nameBtn">Entrar</button>
    </div>
    <div class="body hide" id="body">
      <div class="col">
        <div id="msgs"></div>
        <div class="inbar"><input id="txt" maxlength="500" autocomplete="off"></div>
      </div>
      <div class="mem"><div class="lbl" id="memlbl">Membros</div><div id="mems"></div></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
(function(){
  var SUPABASE_URL="https://gofhwpttgsgypregznhl.supabase.co";
  var SUPABASE_KEY="sb_publishable_y3izbR-JVW7iKaZMOsJCPg_CJ4fZmNt";
  var CHANNELS=["geral","jogos","memes","musica"];
  var $=function(i){return document.getElementById(i)};
  var name="",ch="geral",sb=null,sub=null,msgs=[];
  try{name=localStorage.getItem("chatName")||""}catch(e){}
  var COLORS=["#5865f2","#eb459e","#3ba55d","#faa61a","#ed4245","#00a8fc","#9b59b6","#e67e22"];
  function color(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return COLORS[h%COLORS.length]}
  function avatar(n){var a=document.createElement("div");a.className="av";a.style.background=color(n);a.textContent=(n[0]||"?").toUpperCase();return a}
  function buildChannels(){
    var box=$("chs");box.textContent="";
    CHANNELS.forEach(function(c){
      var b=document.createElement("button");b.className="ch"+(c===ch?" on":"");b.textContent="# "+c;
      b.onclick=function(){ch=c;buildChannels();open()};box.appendChild(b);
    });
  }
  function enter(){
    $("login").classList.add("hide");$("body").classList.remove("hide");
    var me=$("me");me.classList.remove("hide");me.textContent="";me.appendChild(avatar(name));
    var s=document.createElement("span");s.textContent=name;me.appendChild(s);
    open();
  }
  $("nameBtn").onclick=function(){
    var v=$("nameIn").value.trim();if(!v)return;name=v;
    try{localStorage.setItem("chatName",name)}catch(e){}
    enter();
  };
  $("nameIn").onkeydown=function(e){if(e.key==="Enter")$("nameBtn").click()};
  function fmt(t){
    var d=new Date(t),today=new Date().toDateString()===d.toDateString();
    var h=d.toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"});
    return today?"Hoje às "+h:d.toLocaleDateString("pt-PT")+" "+h;
  }
  function render(list){
    var box=$("msgs"),near=box.scrollHeight-box.scrollTop-box.clientHeight<100;
    box.textContent="";
    if(!list.length){var e=document.createElement("div");e.className="empty";e.textContent="Este é o início do canal #"+ch+". Diz olá! 👋";box.appendChild(e)}
    var prev=null;
    list.forEach(function(m){
      var first=!prev||prev.name!==m.name||m.t-prev.t>300000;
      var r=document.createElement("div");r.className="row"+(first?" first":"");
      r.appendChild(first?avatar(m.name):Object.assign(document.createElement("div"),{className:"gap"}));
      var c=document.createElement("div");
      if(first){
        var h=document.createElement("div");h.className="hd";
        var n=document.createElement("span");n.className="nm";n.style.color=color(m.name);n.textContent=m.name;
        var t=document.createElement("span");t.className="ts";t.textContent=fmt(m.t);
        h.appendChild(n);h.appendChild(t);c.appendChild(h);
      }
      var x=document.createElement("div");x.className="tx";x.textContent=m.text;c.appendChild(x);
      r.appendChild(c);box.appendChild(r);prev=m;
    });
    if(near||!box.dataset.init){box.scrollTop=box.scrollHeight;box.dataset.init=1}
    var seen={};list.forEach(function(m){seen[m.name]=1});
    var ms=$("mems");ms.textContent="";var names=Object.keys(seen);
    $("memlbl").textContent="Membros — "+names.length;
    names.forEach(function(n){var i=document.createElement("div");i.className="mi";i.appendChild(avatar(n));var s=document.createElement("span");s.textContent=n;i.appendChild(s);ms.appendChild(i)});
  }
  function showErr(t){
    var b=$("msgs");b.textContent="";
    var e=document.createElement("div");e.className="empty";e.textContent=t;b.appendChild(e);
  }
  function conv(r){return {id:r.id,name:r.autor,text:r.texto,t:Date.parse(r.criado_em)}}
  function add(m){
    if(msgs.some(function(x){return x.id===m.id}))return;
    msgs.push(m);
    msgs.sort(function(a,b){return a.t-b.t||a.id-b.id});
    render(msgs.slice(-100));
  }
  async function open(){
    $("top").innerHTML="";var s=document.createElement("span");s.textContent="#";$("top").appendChild(s);$("top").appendChild(document.createTextNode(ch));
    $("txt").placeholder="Enviar mensagem para #"+ch;
    $("msgs").dataset.init="";
    if(sub&&sb){sb.removeChannel(sub);sub=null}
    var cur=ch;msgs=[];
    if(!sb){
      if(!window.supabase){showErr("Não foi possível carregar o chat. Verifica a ligação à internet e recarrega a página.");return}
      if(SUPABASE_KEY.indexOf("COLA_AQUI")===0){showErr("Falta colar a chave pública do Supabase no ficheiro index.html.");return}
      sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    }
    var res;
    try{
      res=await sb.from("mensagens").select("id,autor,texto,criado_em").eq("canal",cur).order("criado_em",{ascending:false}).limit(100);
    }catch(e){res={error:e}}
    if(cur!==ch)return;
    if(res.error){showErr("Não foi possível ligar ao chat. Tenta recarregar a página.");return}
    msgs=res.data.map(conv).reverse();
    render(msgs);
    sub=sb.channel("chat-"+cur).on("postgres_changes",{event:"INSERT",schema:"public",table:"mensagens",filter:"canal=eq."+cur},function(p){
      if(cur!==ch)return;
      add(conv(p.new));
    }).subscribe();
  }
  async function send(){
    var v=$("txt").value.trim();if(!v||!sb)return;
    var c=ch;
    $("txt").value="";
    var r;
    try{
      r=await sb.from("mensagens").insert({canal:c,autor:name,texto:v}).select("id,autor,texto,criado_em").single();
    }catch(e){r={error:e}}
    if(r.error){$("txt").value=v;return}
    if(c===ch)add(conv(r.data));
  }
  $("txt").onkeydown=function(e){if(e.key==="Enter")send()};
  buildChannels();
  if(name)enter();
})();
</script>
</body>
</html>
